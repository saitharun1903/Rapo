name: free-tier-fit

# Phase 14: does the backend run on the free container host (render.yaml: 512 MB, a tenth of a CPU)? The
# backend starts with the Blueprint's JVM, pool and topic settings under those limits, next to the compose
# PostGIS, Redis and Kafka. The run records its startup time and peak memory, then logs in and completes whole
# rides (k6 login and lifecycle scenarios at 2 VUs). It fails if the backend never becomes healthy or runs out
# of memory. Docker's CPU quota stands in for the host's; the deployed startup time is recorded separately in
# docs/deployment.md.
on:
  workflow_dispatch:
  push:
    paths: ["render.yaml", "infrastructure/free-tier/**", "backend/Dockerfile", "docker-compose.yml", "scripts/init-env.sh",
            "load-tests/scenarios/**", ".github/workflows/free-tier-fit.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:infrastructure/free-tier/compose.yml
  ADMIN_EMAIL: fit-admin@example.com
  VUS: "2"
  DURATION_SECONDS: "60"
  # Copied from render.yaml, so this run uses exactly the deployed values.
  BLUEPRINT_SETTINGS: SPRING_PROFILES_ACTIVE JAVA_TOOL_OPTIONS DATABASE_POOL_SIZE KAFKA_PARTITIONS

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Random secrets for this run only, masked in the logs, never stored.
      - name: Create .env
        run: |
          ./scripts/init-env.sh
          admin_password="Fit-$(openssl rand -hex 16)"
          set_env() {
            if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi
          }
          for name in $BLUEPRINT_SETTINGS; do
            value=$(yq ".services[] | select(.name == \"rideflow-backend\") | .envVars[] | select(.key == \"$name\") | .value" render.yaml)
            if [ -z "$value" ] || [ "$value" = "null" ]; then echo "::error::render.yaml has no value for $name"; exit 1; fi
            set_env "$name" "$value"
            echo "$name=$value"
          done
          # The scenarios log in and book far more often than the per-IP limits allow one address.
          set_env RATE_LIMIT_ENABLED false
          set_env ROUTING_PROVIDER straight-line
          set_env GEOCODING_PROVIDER disabled
          set_env BOOTSTRAP_ADMIN_EMAIL "$ADMIN_EMAIL"
          set_env BOOTSTRAP_ADMIN_PASSWORD "$admin_password"
          for name in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET DEMO_USER_PASSWORD GRAFANA_ADMIN_PASSWORD BOOTSTRAP_ADMIN_PASSWORD; do
            echo "::add-mask::$(grep "^$name=" .env | cut -d= -f2-)"
          done
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Build the backend image
        run: docker compose build backend

      - name: Start the infrastructure
        run: docker compose up -d --wait --wait-timeout 300 postgres redis kafka

      # Timed on its own: the image is built and the infrastructure healthy, so this is the backend's startup.
      - name: Start the backend at 512 MB and 0.1 CPU
        run: |
          start=$SECONDS
          docker compose up -d --no-deps --wait --wait-timeout 900 backend
          echo "STARTUP_SECONDS=$(( SECONDS - start ))" >> "$GITHUB_ENV"
          echo "PEAK_AFTER_STARTUP=$(docker compose exec -T backend cat /sys/fs/cgroup/memory.peak)" >> "$GITHUB_ENV"

      - name: Log in and complete rides
        run: SCENARIOS="login lifecycle" LEVELS="$VUS" DURATION="${DURATION_SECONDS}s" bash load-tests/scenarios/run.sh

      - name: Report
        run: |
          id=$(docker compose ps -q backend)
          oom=$(docker inspect -f '{{.State.OOMKilled}}' "$id")
          restarts=$(docker inspect -f '{{.RestartCount}}' "$id")
          running=$(docker inspect -f '{{.State.Running}}' "$id")
          limit=$(docker compose exec -T backend cat /sys/fs/cgroup/memory.max)
          peak=$(docker compose exec -T backend cat /sys/fs/cgroup/memory.peak)
          current=$(docker compose exec -T backend cat /sys/fs/cgroup/memory.current)
          mib() { echo "$(( $1 / 1048576 )) MiB"; }
          {
            echo "Runner: $(nproc) vCPU, $(lscpu | sed -n 's/^Model name: *//p'); backend limited to $(mib "$limit") and 0.1 CPU."
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Startup to healthy (image built, infrastructure up) | ${STARTUP_SECONDS} s |"
            echo "| Peak memory after startup | $(mib "$PEAK_AFTER_STARTUP") |"
            echo "| Peak memory after the scenarios | $(mib "$peak") |"
            echo "| Memory at the end | $(mib "$current") |"
            echo "| Out-of-memory kill / restarts / running | $oom / $restarts / $running |"
            echo
            echo "JVM options: \`$(grep '^JAVA_TOOL_OPTIONS=' .env | cut -d= -f2-)\`"
            echo
            python3 load-tests/scenarios/report.py load-tests/results/scenarios "$DURATION_SECONDS"
          } > load-tests/results/scenarios/report.md
          cat load-tests/results/scenarios/report.md >> "$GITHUB_STEP_SUMMARY"
          body=$(head -c 60000 load-tests/results/scenarios/report.md | tr -d '\r' | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')
          echo "::notice title=Free-tier fit::$body"
          if [ "$oom" != "false" ] || [ "$restarts" != "0" ] || [ "$running" != "true" ]; then
            echo "::error title=Free-tier fit::the backend was killed or restarted under the free tier's limits"
            exit 1
          fi

      - name: Diagnose a failure
        if: failure()
        run: |
          encode() { head -c 3500 | tr -d '\r' | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }'; }
          echo "::warning title=Containers::$(docker compose ps -a --format '{{.Service}}: {{.Status}}' | encode)"
          docker compose logs --no-color --no-log-prefix backend > backend.log 2>&1 || true
          echo "::warning title=Backend log (last lines)::$(tail -n 40 backend.log | encode)"
          echo "::warning title=Backend errors::$(grep -E '"level":"(WARN|ERROR)"|OutOfMemory|Killed' backend.log | tail -n 20 | encode)"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: free-tier-fit-results
          path: load-tests/results/scenarios
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v
