name: secret-scan

# gitleaks over the whole history on every push and pull request: a secret committed and then deleted is
# still in history, so scanning only the latest diff would miss it. Findings that were reviewed and
# accepted are listed by fingerprint in .gitleaksignore. Annotations name the file, line and rule, never the
# value.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    # A pull request from a branch of this repository was already checked by that branch's push; only pull
    # requests from forks run again.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release binary, checked against the release's published checksums.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$archive" "$base/$archive"
          curl -sSLf -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the history
        run: |
          status=0
          ./gitleaks git --no-banner --redact --report-format json --report-path gitleaks.json . || status=$?
          python3 - <<'PY'
          import json
          for finding in json.load(open("gitleaks.json")):
              print(f"::error file={finding['File']},line={finding['StartLine']},title=Possible secret"
                    f"::{finding['RuleID']} in commit {finding['Commit'][:8]}. If it is not a secret, add its "
                    f"fingerprint to .gitleaksignore: {finding['Fingerprint']}")
          PY
          exit "$status"
