name: backend-ci

on:
  push:
    paths: ["backend/**", "docs/openapi.json", ".github/workflows/backend-ci.yml", ".github/scripts/**"]
  pull_request:
    paths: ["backend/**", "docs/openapi.json", ".github/workflows/backend-ci.yml", ".github/scripts/**"]

# A newer push to the same branch or pull request makes a running check obsolete, so it is cancelled.
# On main every commit keeps its own run (the SHA is part of the group), so nothing there is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # A pull request from a branch of this repository was already checked by that branch's push; only pull
    # requests from forks run again.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit, web-slice and ArchUnit tests (surefire), then Testcontainers integration tests (failsafe).
      # Normally a few minutes. If it is still running after 12, a watchdog records the running JVMs and
      # containers and dumps every JVM's threads (summarised below), so an intermittent hang can be diagnosed;
      # the step gives up at 20.
      - name: Build and test
        timeout-minutes: 20
        run: |
          # Every JVM (Maven and its test forks) and the containers: a stall has been seen with no test fork running.
          ( sleep 720
            { jcmd -l; docker ps --format '{{.Image}} {{.Status}}'
              for pid in $(jcmd -l | awk '!/JCmd/ { print $1 }'); do jcmd "$pid" Thread.print; done
            } > "$GITHUB_WORKSPACE/threads.txt" 2>&1 ) > /dev/null 2>&1 &
          watchdog=$!
          status=0
          ./mvnw -B verify || status=$?
          pkill -P "$watchdog" 2>/dev/null || true
          kill "$watchdog" 2>/dev/null || true
          exit "$status"

      - name: Summarise stalled threads
        if: always() && hashFiles('threads.txt') != ''
        run: |
          # The JVMs and containers that were running (the first lines of the file), then the threads.
          echo "::warning title=Processes at the stall::$(grep -vE '^("|\s|$)' "$GITHUB_WORKSPACE/threads.txt" | head -n 20 | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')"
          python3 "$GITHUB_WORKSPACE/.github/scripts/thread_dump_summary.py" "$GITHUB_WORKSPACE/threads.txt"

      # Integration tests skip themselves when Docker is missing; in CI that must never happen silently.
      - name: Assert integration tests actually ran
        run: |
          summary=target/failsafe-reports/failsafe-summary.xml
          grep -q "<skipped>0</skipped>" "$summary" || { cat "$summary"; echo "Integration tests were skipped"; exit 1; }

      # The merged unit + integration report: a table on the run page, notices readable through the checks API,
      # and the HTML report as an artifact.
      # Also when the coverage gate failed, so the numbers that failed it are on the run page.
      - name: Coverage summary
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: |
          python3 ../.github/scripts/coverage_summary.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          python3 ../.github/scripts/coverage_summary.py target/site/jacoco/jacoco.csv --annotate

      - name: Upload coverage report
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

      # Surface each failing test class as an annotation so failures are readable on the commit/PR page.
      # Workflow commands need '%' and newlines percent-encoded.
      - name: Annotate test failures
        if: failure()
        run: |
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            grep -qE "FAILURE|ERROR" "$report" || continue
            body=$(head -c 3500 "$report" | tr -d '\r' | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')
            echo "::error title=$(basename "$report" .txt)::$body"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
