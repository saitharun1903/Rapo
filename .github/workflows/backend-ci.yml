name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit, web-slice and ArchUnit tests (surefire), then Testcontainers integration tests (failsafe).
      - name: Build and test
        run: ./mvnw -B verify

      # Integration tests skip themselves when Docker is missing; in CI that must never happen silently.
      - name: Assert integration tests actually ran
        run: |
          summary=target/failsafe-reports/failsafe-summary.xml
          grep -q "<skipped>0</skipped>" "$summary" || { cat "$summary"; echo "Integration tests were skipped"; exit 1; }

      # Surface each failing test class as an annotation so failures are readable on the PR/commit page.
      - name: Annotate test failures
        if: failure()
        run: |
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            grep -qE "FAILURE|ERROR" "$report" || continue
            body=$(head -c 3500 "$report" | sed ':a;N;$!ba;s/%/%25/g;s//%0D/g;s/
/%0A/g')
            echo "::error title=$(basename "$report" .txt)::$body"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
