name: frontend-ci

on:
  push:
    paths: ["frontend/**", "simulator/**", "docs/openapi.json", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "simulator/**", "docs/openapi.json", ".github/workflows/frontend-ci.yml"]

# A newer push to the same branch or pull request makes a running check obsolete, so it is cancelled.
# On main every commit keeps its own run (the SHA is part of the group), so nothing there is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The API types are generated from docs/openapi.json, which the backend build checks against the code.
      - name: API types match the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts || { echo "Run 'npm run api:types' and commit the result"; exit 1; }

      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests, with coverage
        run: npm run test:coverage

      - name: Coverage summary
        run: |
          node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          node scripts/coverage-summary.mjs --annotate

      - run: npm run build

  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
