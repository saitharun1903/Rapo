name: e2e

# The Docker Compose stack from a clean checkout, the way the README says to run it: init-env.sh writes .env,
# `docker compose --profile demo up --build` builds the three images and starts everything, and the Playwright
# suite then runs against the containers (frontend on :3000, backend on :8080, simulated drivers). Afterwards
# every Grafana panel query runs against the Prometheus that watched those rides. On a push to main, the images
# that passed all of this are published to GHCR.
on:
  push:
    paths: ["frontend/**", "backend/**", "simulator/**", "docs/openapi.json", "docker-compose.yml", ".env.example",
            "scripts/init-env.sh", "infrastructure/**", ".github/workflows/e2e.yml", ".github/scripts/**"]
  pull_request:
    paths: ["frontend/**", "backend/**", "simulator/**", "docs/openapi.json", "docker-compose.yml", ".env.example",
            "scripts/init-env.sh", "infrastructure/**", ".github/workflows/e2e.yml", ".github/scripts/**"]

# A newer push to the same branch or pull request makes a running check obsolete, so it is cancelled.
# On main every commit keeps its own run (the SHA is part of the group), so nothing there is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Publishing to GHCR (main only). Pull requests from forks get a read-only token regardless.
  packages: write

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The clean-clone path: random secrets for this run only, masked in the logs, never stored.
      - name: Create .env
        run: |
          ./scripts/init-env.sh
          for name in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET DEMO_USER_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            echo "::add-mask::$(grep "^$name=" .env | cut -d= -f2-)"
          done
          # Fast simulated drivers, so a whole ride fits in a test.
          printf 'SIM_SPEED_MPS=60\nSIM_BOARDING_MS=2000\n' >> .env

      - name: Validate the compose file
        run: docker compose --profile demo config --quiet

      - uses: docker/setup-buildx-action@v4

      # The compose file's three images, with their layers cached in GitHub's cache service (one scope per
      # image), so a run whose dependencies did not change reuses those layers instead of downloading them.
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: backend,frontend,simulator
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            simulator.cache-from=type=gha,scope=simulator
            simulator.cache-to=type=gha,scope=simulator,mode=max
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}

      - name: Start the stack
        run: |
          start=$SECONDS
          docker compose --profile demo up -d --wait --wait-timeout 300
          echo "::notice title=Stack startup::healthy after $(( SECONDS - start )) s"
          echo "::notice title=Image sizes::$(docker image ls --format '{{.Repository}} {{.Size}}' 'rideflow-*' | paste -sd ',' - | sed 's/,/, /g')"
          docker compose ps

      # Straight through the frontend container: its /api rewrite reaches the backend container.
      - name: Smoke check
        run: |
          curl -fsS -o /dev/null http://localhost:3000/
          password=$(grep '^DEMO_USER_PASSWORD=' .env | cut -d= -f2-)
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@rideflow.example.com\",\"password\":\"$password\"}" http://localhost:3000/api/auth/login)
          [ "$status" = 200 ] || { echo "Login through the frontend returned $status"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright against the compose stack
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          DEMO_USER_PASSWORD=$(grep '^DEMO_USER_PASSWORD=' ../.env | cut -d= -f2-) npx playwright test

      # The rides above were scraped by Prometheus: the dashboards must show them.
      - name: Dashboards show live data
        run: |
          GRAFANA_PASSWORD=$(grep '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-) \
            python3 .github/scripts/check_dashboards.py http://localhost:3001

      # Only images that passed every step above, and only from main. The frontend image is built for this
      # compose stack (/api forwarded to http://backend:8080, WebSocket on ws://localhost:8080/ws); a deployment
      # builds its own with its URLs (docs/development.md).
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          published=""
          for image in backend frontend simulator; do
            for tag in "$GITHUB_SHA" latest; do
              docker tag "rideflow-$image:local" "ghcr.io/$owner/rideflow-$image:$tag"
              docker push --quiet "ghcr.io/$owner/rideflow-$image:$tag"
            done
            published="$published ghcr.io/$owner/rideflow-$image:$GITHUB_SHA"
          done
          echo "::notice title=Published images::$published (also tagged latest)"

      # The deployed backend (render.yaml) runs the image just published, by its commit tag rather than latest.
      # The hook URL is a secret of this repository; until it is set, the step says so and deploys nothing.
      - name: Deploy the backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice title=Backend deploy::Not requested: the RENDER_DEPLOY_HOOK_URL secret is not set (docs/deployment.md)"
            exit 0
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/rideflow-backend:$GITHUB_SHA"
          curl -fsS --get --data-urlencode "imgURL=$image" -o /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo "::notice title=Backend deploy::Render deploy requested for $image"

      # A backend that is slow or stuck: SIGQUIT makes the JVM print a thread dump to its log (the JRE image has
      # no jcmd), which is condensed into annotations with the recent warnings and the simulator's log.
      - name: Diagnose a failure
        if: failure()
        run: |
          encode() { head -c 3500 | tr -d '\r' | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }'; }
          echo "::warning title=Containers::$(docker compose --profile demo ps -a --format '{{.Service}}: {{.Status}}' | encode)"
          for service in frontend backend; do
            echo "::warning title=Health of $service::$(docker inspect --format '{{json .State.Health}}' "$(docker compose ps -aq "$service")" 2>&1 | encode)"
          done
          docker compose kill -s SIGQUIT backend || true
          sleep 2
          docker compose logs --no-color --no-log-prefix backend > backend.log 2>&1 || true
          docker compose logs --no-color --no-log-prefix simulator > simulator.log 2>&1 || true
          echo "--- backend (last 150 lines)"; tail -n 150 backend.log
          echo "--- simulator (last 100 lines)"; tail -n 100 simulator.log
          echo "::warning title=Backend warnings and errors::$(grep -E ' (WARN|ERROR) ' backend.log | tail -n 25 | encode)"
          echo "::warning title=Simulator log::$(tail -n 25 simulator.log | encode)"
          # What each failed test's page showed: Playwright's accessibility snapshot at the moment it failed.
          for context in frontend/test-results/*/error-context.md; do
            [ -f "$context" ] || continue
            echo "::warning title=Page at failure: $(basename "$(dirname "$context")" | cut -c1-60)::$(encode < "$context")"
          done
          python3 .github/scripts/thread_dump_summary.py backend.log

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose --profile demo down -v
