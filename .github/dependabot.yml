# Weekly dependency update pull requests, each checked by the same CI as any other change. Minor and patch
# updates are grouped per ecosystem to keep the number of pull requests down; major versions come one at a
# time, since those are the ones that need reading.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the Node line the images run (24 LTS), which moves only with the Dockerfiles.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /simulator
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      simulator-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /simulator]
    schedule: { interval: weekly }
    ignore:
      # Runtime lines are chosen, not bumped: Node and Java move to the next LTS release together with the
      # code, the setup-node/setup-java versions in CI and the docs, never to a non-LTS release.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose-images:
        update-types: [minor, patch]
