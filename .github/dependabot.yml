# Weekly dependency update pull requests, each checked by the same CI as any other change. Minor and patch
# updates are grouped per ecosystem to keep the number of pull requests down; major versions come one at a
# time, since those are the ones that need reading.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /simulator
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      simulator-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /simulator]
    schedule: { interval: weekly }
    groups:
      base-images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose-images:
        update-types: [minor, patch]
