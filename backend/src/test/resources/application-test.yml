# Test-only values. The datasource is supplied by Testcontainers (@ServiceConnection) in integration tests.
spring:
  datasource:
    password: provided-by-testcontainers
  flyway:
    # Integration tests share one database across Spring contexts with and without the "demo" profile,
    # so the repeatable seed migration may be applied but absent from a later context's locations.
    ignore-migration-patterns: "*:missing,*:future"

rideflow:
  scheduling:
    enabled: false
  kafka:
    # Resolved once per Spring context (bound into EventingProperties): each cached context gets its own
    # topics and consumer groups, so contexts with different beans (clocks, stubs) never consume each
    # other's events.
    prefix: "it-${random.uuid}."
  # No network in tests; the OSRM client is covered by RoutingTest with a mock server.
  routing:
    provider: straight-line
  geocoding:
    provider: disabled
  # No model in CI; AiTripInsightsIT points a context at a WireMock stand-in instead.
  ai:
    provider: disabled
  # Integration tests share one Redis and create many users per minute; RateLimitIT enables limiting itself.
  rate-limit:
    enabled: false
  security:
    bcrypt-strength: 4
    jwt:
      secret: test-only-signing-secret-with-at-least-32-bytes
    refresh-token:
      cookie-secure: false

management:
  server:
    port: 0

# A developer's .env (imported by application.yml for host runs) must not send test errors to a real Sentry
# project; ErrorReportingIT points a context at a stand-in instead.
sentry:
  dsn: ""
