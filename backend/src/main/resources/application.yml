# All secrets and environment-specific values come from environment variables (see /.env.example).
# Variables without a default are required: the application refuses to start without them.

spring:
  application:
    name: rideflow-backend
  config:
    # Local development convenience: read the repository's .env (KEY=VALUE) when running from the repo root
    # or from backend/. Optional, so containers and production rely purely on real environment variables.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rideflow}
    username: ${DATABASE_USERNAME:rideflow}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # Short timeouts: everything in Redis is optional, and a slow Redis must not make requests slow.
      timeout: 500ms
      connect-timeout: 1s
  jackson:
    default-property-inclusion: always
  task:
    execution:
      # The WebSocket broker registers its own executors, which would otherwise make Spring Boot skip the
      # application executor that @Async listeners (matching trigger, real-time pushes) run on.
      mode: force

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # Redis is deliberately absent: caches and rate limits fail open, so a Redis outage should not take
          # instances out of the load balancer. It still shows in the overall health status.
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

rideflow:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:rideflow}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:14d}
      cleanup-retention: 7d
      cleanup-cron: "0 15 3 * * *"
      cookie-name: rf_refresh
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      cookie-path: /api/auth
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Rate card (INR). Bump "version" whenever rates change; it is stored with every fare.
  pricing:
    currency: INR
    version: 2026-09-v1
    rounding-increment: 1.00
    categories:
      ECONOMY: { base-fare: 40, per-km: 12, per-minute: 1.5, booking-fee: 10, minimum-fare: 80 }
      COMFORT: { base-fare: 60, per-km: 16, per-minute: 2.0, booking-fee: 15, minimum-fare: 120 }
      XL:      { base-fare: 90, per-km: 22, per-minute: 2.5, booking-fee: 20, minimum-fare: 180 }
  surge:
    enabled: ${SURGE_ENABLED:true}
    radius-meters: 2000
    demand-window: 10m
    sensitivity: 0.5
    threshold: 1.0
    max-multiplier: 2.5
    step: 0.1
  matching:
    initial-radius-meters: 3000
    radius-growth: 1.5
    max-radius-meters: 8000
    max-rounds: 3
    candidate-limit: 10
    offers-per-round: 3
    offer-ttl: 20s
    location-freshness: 30s
    trigger-grace: 5s
    sweep-interval: PT5S
    sweep-batch-size: 50
  ride:
    # Demo city: Hyderabad. Change SERVICE_AREA_* for another city.
    service-area:
      center:
        lat: ${SERVICE_AREA_CENTER_LAT:17.3850}
        lng: ${SERVICE_AREA_CENTER_LNG:78.4867}
      radius-meters: ${SERVICE_AREA_RADIUS_METERS:40000}
    min-trip-distance-meters: 200
    quote-ttl: 5m
    quote-match-tolerance-meters: 50
    pickup-geofence-meters: 150
    no-show-wait: 5m
    location:
      max-age: 30s
      max-future-skew: 5s
      track-min-interval: 10s
      track-min-distance-meters: 25
  realtime:
    heartbeat: 10s
    location-min-interval: 1s
    connect-timeout: 10s
    session-sweep-interval: PT15S
    presence:
      timeout: 2m
      sweep-interval: PT30S
      sweep-batch-size: 100
  cache:
    enabled: ${CACHE_ENABLED:true}
    route-ttl: 15m
    geocode-ttl: 24h
    surge-ttl: 60s
    eta-ttl: 30s
    redis-retry-after: 5s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      LOGIN: { limit: 5, window: 1m }
      REGISTER: { limit: 3, window: 1m }
      RIDE_BOOKING: { limit: 5, window: 1m }
      FARE_ESTIMATE: { limit: 30, window: 1m }
      GEOCODING: { limit: 30, window: 1m }
      GEOCODING_UPSTREAM: { limit: 1, window: 1s }
  geocoding:
    provider: ${GEOCODING_PROVIDER:nominatim}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:RideFlow/0.1 (+https://github.com/saitharun1903/Rapo)}
    connect-timeout: 2s
    read-timeout: 4s
    result-limit: 5
    country-codes: ${GEOCODING_COUNTRY_CODES:in}
    bias-box-degrees: 0.25
  routing:
    provider: ${ROUTING_PROVIDER:osrm}
    osrm-base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
    connect-timeout: 2s
    read-timeout: 4s
    circuity-factor: 1.3
    average-speed-kmh: 24
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
