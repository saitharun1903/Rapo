# All secrets and environment-specific values come from environment variables (see /.env.example).
# Variables without a default are required: the application refuses to start without them.

spring:
  application:
    name: rideflow-backend
  config:
    # Local development convenience: read the repository's .env (KEY=VALUE) when running from the repo root
    # or from backend/. Optional, so containers and production rely purely on real environment variables.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rideflow}
    username: ${DATABASE_USERNAME:rideflow}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # Short timeouts: everything in Redis is optional, and a slow Redis must not make requests slow.
      timeout: 500ms
      connect-timeout: 1s
  jackson:
    default-property-inclusion: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    # Plaintext for the compose broker; a managed broker takes SASL_SSL with SCRAM (docs/deployment.md). The
    # SASL settings are only read on a SASL connection.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    producer:
      # Wait for all in-sync replicas; with idempotence, retries cannot duplicate or reorder records.
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is unreachable: the outbox retries later, and a location report is dropped
        # rather than blocking the WebSocket thread.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # Shared groups start from the beginning of what is retained, so no event produced before a group's
      # first start is missed. The realtime bridge overrides this with "latest".
      auto-offset-reset: earliest
    admin:
      # Topics are declared by the application; startup continues (and logs) if the broker is not up yet.
      fail-fast: false
  task:
    execution:
      # The WebSocket broker registers its own executors, which would otherwise make Spring Boot skip the
      # application executor that @Async methods (the background ETA refresh) run on.
      mode: force

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  # Forwarding headers (X-Forwarded-For/-Proto/-Host/-Port) are applied by Tomcat's RemoteIpValve, and only on
  # connections from TRUSTED_PROXIES. The client address is then the right-most X-Forwarded-For hop that is not
  # a trusted proxy. From anyone else the headers are ignored, so a caller cannot choose its own address for the
  # per-IP rate limits, or its scheme and host for CORS and the WebSocket Origin check. RFC 7239 "Forwarded" is
  # never read. See docs/architecture.md section 9.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Comma-separated CIDR ranges of reverse proxies that overwrite or append X-Forwarded-For. Empty trusts
      # none. Never list the Next.js frontend alone: its /api rewrite passes the browser's header on unchanged.
      internal-proxies: ${TRUSTED_PROXIES:}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # Also /livez and /readyz on the public port, for hosts that can only probe the port they route to
        # (docs/deployment.md). Those groups show the status only.
        add-additional-paths: true
      show-details: never
      # Component names and UP/DOWN only (no details), for the admin console's system view. The management
      # port is not public.
      show-components: always
      group:
        readiness:
          # Redis is deliberately absent: caches and rate limits fail open, so a Redis outage should not take
          # instances out of the load balancer. It still shows in the overall health status.
          include: readinessState,db
          show-components: never
        # Declaring the group replaces the default one, so its member is named again: liveness must not
        # depend on the database or brokers, or an outage would restart every instance.
        liveness:
          include: livenessState
          show-components: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for the latencies the dashboards chart as percentiles; buckets (unlike client-side
      # percentiles) can be aggregated across instances with histogram_quantile.
      percentiles-histogram:
        http.server.requests: true
        rideflow.matching.duration: true
        rideflow.ai.latency: true
      # Matching runs up to max-rounds offer rounds and a local model may take its full timeout; the default
      # upper bucket (30 s) would lump those together.
      maximum-expected-value:
        rideflow.matching.duration: 5m
        rideflow.ai.latency: 2m

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

# Error reporting. Without SENTRY_DSN (the default) nothing is sent anywhere. ERROR log events become Sentry
# events and INFO+ ones their breadcrumbs; SentryScrubber strips personal data and credentials before sending.
# Metrics and latency live in Prometheus, so Sentry tracing stays off.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  max-request-body-size: none
  in-app-includes: com.rideflow
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

rideflow:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:rideflow}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:14d}
      cleanup-retention: 7d
      # A rotated token presented again this soon, while its successor has never been used, is a client that
      # lost the response (a reload or dropped connection mid-refresh), not a replay; see RefreshTokenService.
      reuse-grace: ${REFRESH_TOKEN_REUSE_GRACE:10s}
      cleanup-cron: "0 15 3 * * *"
      cookie-name: rf_refresh
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      cookie-path: /api/auth
    # The browser address the frontend signs for the requests it forwards (architecture.md section 9). Empty
    # turns it off; the same value goes in the frontend's environment.
    client-ip:
      signing-secret: ${CLIENT_IP_SIGNING_SECRET:}
      # Replay window and clock skew between frontend and backend, either way.
      max-age: 60s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Rate card (INR). Bump "version" whenever rates change; it is stored with every fare.
  pricing:
    currency: INR
    version: 2026-09-v1
    rounding-increment: 1.00
    categories:
      ECONOMY: { base-fare: 40, per-km: 12, per-minute: 1.5, booking-fee: 10, minimum-fare: 80 }
      COMFORT: { base-fare: 60, per-km: 16, per-minute: 2.0, booking-fee: 15, minimum-fare: 120 }
      XL:      { base-fare: 90, per-km: 22, per-minute: 2.5, booking-fee: 20, minimum-fare: 180 }
  surge:
    enabled: ${SURGE_ENABLED:true}
    radius-meters: 2000
    demand-window: 10m
    sensitivity: 0.5
    threshold: 1.0
    max-multiplier: 2.5
    step: 0.1
  matching:
    initial-radius-meters: 3000
    radius-growth: 1.5
    max-radius-meters: 8000
    max-rounds: 3
    candidate-limit: 10
    offers-per-round: 3
    offer-ttl: 20s
    location-freshness: 30s
    trigger-grace: 5s
    sweep-interval: PT5S
    sweep-batch-size: 50
  ride:
    # Demo city: Hyderabad. Change SERVICE_AREA_* for another city.
    service-area:
      center:
        lat: ${SERVICE_AREA_CENTER_LAT:17.3850}
        lng: ${SERVICE_AREA_CENTER_LNG:78.4867}
      radius-meters: ${SERVICE_AREA_RADIUS_METERS:40000}
    min-trip-distance-meters: 200
    quote-ttl: 5m
    quote-match-tolerance-meters: 50
    pickup-geofence-meters: 150
    no-show-wait: 5m
    location:
      max-age: 30s
      max-future-skew: 5s
      track-min-interval: 10s
      track-min-distance-meters: 25
  reporting:
    # Earnings and admin analytics cut hour and day buckets in this zone (the demo city's), so "today"
    # means the same thing to every viewer.
    time-zone: ${REPORTING_TIME_ZONE:Asia/Kolkata}
    # Upper bound on buckets per request (about 16 days of hours or a year of days), to bound the query.
    max-buckets: 400
  realtime:
    heartbeat: 10s
    location-min-interval: 1s
    connect-timeout: 10s
    session-sweep-interval: PT15S
    presence:
      timeout: 2m
      sweep-interval: PT30S
      sweep-batch-size: 100
  cache:
    enabled: ${CACHE_ENABLED:true}
    route-ttl: 15m
    geocode-ttl: 24h
    surge-ttl: 60s
    eta-ttl: 30s
    driver-state-ttl: 60s
    driver-location-ttl: 5m
    redis-retry-after: 5s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      LOGIN: { limit: 5, window: 1m }
      REGISTER: { limit: 3, window: 1m }
      RIDE_BOOKING: { limit: 5, window: 1m }
      FARE_ESTIMATE: { limit: 30, window: 1m }
      GEOCODING: { limit: 30, window: 1m }
      GEOCODING_UPSTREAM: { limit: 1, window: 1s }
      AI_QUESTION: { limit: 10, window: 1h }
      AI_REGENERATE: { limit: 3, window: 1h }
  kafka:
    prefix: ${KAFKA_TOPIC_PREFIX:}
    # Managed services bill per partition; every topic and its DLT get this many.
    partitions: ${KAFKA_PARTITIONS:3}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    retention:
      lifecycle: 7d
      location: 6h
      notification: 3d
      dead-letter: 14d
    retry:
      attempts: 3
      initial-interval: 1s
      multiplier: 2
    processed-events-retention: 7d
    cleanup-cron: "0 30 3 * * *"
  outbox:
    relay-enabled: true
    batch-size: 100
    poll-interval: 250ms
    send-timeout: 10s
    error-backoff: 5s
    retention: 3d
  payments:
    platform-fee-rate: 0.20
  ai:
    # local (Ollama) | external (Anthropic API) | disabled. Disabled by default so a fresh clone needs neither.
    provider: ${AI_PROVIDER:disabled}
    pending-timeout: 15m
    local:
      base-url: ${AI_LOCAL_BASE_URL:http://localhost:11434}
      model: ${AI_LOCAL_MODEL:llama3.2}
      temperature: 0.2
      connect-timeout: 2s
      timeout: ${AI_LOCAL_TIMEOUT:120s}
      max-output-tokens: 1024
    external:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${AI_EXTERNAL_BASE_URL:https://api.anthropic.com}
      model: ${AI_EXTERNAL_MODEL:claude-opus-5}
      effort: low
      timeout: 60s
      # Room for adaptive thinking before the JSON answer.
      max-output-tokens: 4096
    resilience:
      max-attempts: 2
      backoff: 1s
      max-retry-after: 10s
      failure-rate-threshold: 50
      sliding-window-size: 20
      open-duration: 60s
      max-concurrent-calls: 4
    observations:
      fare-delta-percent: 5
      distance-delta-percent: 10
      duration-delta-percent: 20
      detour-ratio: 1.5
      history-min-trips: 3
      history-max-trips: 20
      history-fare-per-km-delta-percent: 20
    validation:
      numeric-tolerance: 0.01
  geocoding:
    provider: ${GEOCODING_PROVIDER:nominatim}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:RideFlow/0.1 (+https://github.com/saitharun1903/Rapo)}
    connect-timeout: 2s
    read-timeout: 4s
    result-limit: 5
    country-codes: ${GEOCODING_COUNTRY_CODES:in}
    bias-box-degrees: 0.25
  routing:
    provider: ${ROUTING_PROVIDER:osrm}
    osrm-base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
    connect-timeout: 2s
    read-timeout: 4s
    circuity-factor: 1.3
    average-speed-kmh: 24
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
